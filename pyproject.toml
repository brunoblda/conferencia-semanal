[project]
name = "conferencia-semanal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "brunoblda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
conferencia-semanal = "conferencia_semanal:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "ignr>=2.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
