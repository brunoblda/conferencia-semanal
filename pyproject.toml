[project]
name = "conferencia-semanal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "brunoblda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
conferencia-semanal = "conferencia_semanal:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "ignr>=2.3",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
]

# ==========================================
# taskipy — Gerenciamento de tarefas
# ==========================================

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
fix = "ruff check --fix ."
lint_deep = "pylint src tests"
test = "pytest"
coverage = "pytest --cov=src --cov-report=term-missing --cov-report=html"
commit = "cz commit"
bump = "cz bump"

# ==========================================
# COMMITIZEN — Gerenciamento de versões e changelog
# ==========================================

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

# ==========================================
# RUFF — Formatação e análise estática
# ==========================================

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E4",   # Erros de importação e indentação
    "E7",   # Erros de sintaxe/estilo
    "E9",   # Erros graves
    "F",    # Pyflakes
    "I",    # Organização dos imports
    "W",    # Avisos de estilo e convenções
    "B",    # Possíveis bugs
    "UP",   # Modernização de sintaxe Python
    "C",    # Complexidade do código
    "SIM",  # Simplificação de código
]
extend-select = ["E501"] # Verifica linhas maiores que 88 caracteres

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ==========================================
# PYLINT — Análise complementar
# ==========================================

[tool.pylint.main]
py-version = "3.14"
jobs = 0
ignore = [".venv", "build", "dist"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-branches = 12
max-statements = 50

[tool.pylint.messages_control]
disable = [
    "line-too-long",             # Ruff verifica
    "wrong-import-order",        # Ruff organiza
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

# ==========================================
# PYTEST — Execução dos testes
# ==========================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: testes unitários",
    "integration: testes de integração",
    "slow: testes demorados",
]

# ==========================================
# COVERAGE — Cobertura dos testes
# ==========================================

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2




